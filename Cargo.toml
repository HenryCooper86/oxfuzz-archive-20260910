[workspace]
resolver = "2"
members = [
    "crates/hf-core",
    "crates/hf-provider",
    "crates/hf-session",
    "crates/hf-context",
    "crates/hf-tools",
    "crates/hf-skills",
    "crates/hf-prompt",
    "crates/hf-storage",
    "crates/hf-spill",
    "crates/hf-runtime",
    "crates/hf-scheduler",
    "crates/hf-knowledge",
    "crates/hf-diagnostics",
    "crates/hf-guardrails",
    "crates/hf-discovery",
    "crates/hf-analysis",
    "crates/hf-harness",
    "crates/hf-engine",
    "crates/hf-crash",
    "crates/hf-corpus",
    "crates/hf-coverage",
    "crates/hf-automotive",
    "crates/hf-service",
    "crates/hf-agent",
    "crates/hf-web",
    "crates/hf-cli",
    "crates/hf-test-utils",
    "crates/hf-gui/src-tauri",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/HenryCooper86/oxfuzz"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
shlex = "2.0.1"

# Markdown rendering (report export to HTML)
comrak = { version = "0.29", default-features = false }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Identifiers
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Hashing / Crypto
sha2 = "0.10"
hex = "0.4"
regex = "1"
subtle = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "4"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "uuid",
    "chrono",
    "json",
] }

# HTTP client. Feature-pinned rather than default: reqwest 0.13's default-tls
# is rustls over aws-lc-sys, whose build needs cmake (and NASM on Windows).
# native-tls keeps 0.12's platform TLS stack with no extra build toolchain.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "socks",
    "native-tls",
    "http2",
    "charset",
    "system-proxy",
] }

# Web API
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Encoding
base64 = "0.22"

# JSON Schema validation
jsonschema = "0.28"

# File search
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# Parsing (target discovery)
tree-sitter = "0.26"
streaming-iterator = "0.1.9"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dialoguer = "0.11"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
fs2 = "0.4.3"
cap-primitives = "4.0.3"
windows-sys = "0.61"

# Markdown rendering
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd"] }

# TUI
ratatui = "0.28"
crossterm = "0.28"
tui-textarea = "0.6"
unicode-width = "0.2"

# Internal crates
hf-core = { path = "crates/hf-core" }
hf-provider = { path = "crates/hf-provider" }
hf-session = { path = "crates/hf-session" }
hf-context = { path = "crates/hf-context" }
hf-tools = { path = "crates/hf-tools" }
hf-skills = { path = "crates/hf-skills" }
hf-prompt = { path = "crates/hf-prompt" }
hf-storage = { path = "crates/hf-storage" }
hf-runtime = { path = "crates/hf-runtime" }
hf-scheduler = { path = "crates/hf-scheduler" }
hf-knowledge = { path = "crates/hf-knowledge" }
hf-spill = { path = "crates/hf-spill" }
hf-diagnostics = { path = "crates/hf-diagnostics" }
hf-guardrails = { path = "crates/hf-guardrails" }
hf-discovery = { path = "crates/hf-discovery" }
hf-analysis = { path = "crates/hf-analysis" }
hf-harness = { path = "crates/hf-harness" }
hf-engine = { path = "crates/hf-engine" }
hf-crash = { path = "crates/hf-crash" }
hf-corpus = { path = "crates/hf-corpus" }
hf-coverage = { path = "crates/hf-coverage" }
hf-automotive = { path = "crates/hf-automotive", default-features = false }
hf-service = { path = "crates/hf-service", default-features = false }
hf-agent = { path = "crates/hf-agent" }
hf-web = { path = "crates/hf-web", default-features = false }
hf-cli = { path = "crates/hf-cli" }
hf-test-utils = { path = "crates/hf-test-utils" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
undocumented_unsafe_blocks = "deny"

[workspace.lints.rust]
unused_assignments = "allow"
