name: CI

# Runs the gate set defined by scripts/tests/gates.sh on every push and pull
# request. That script stays the single definition of what a gate means; this
# workflow only decides which gates run where, so the two cannot drift.
#
# The full gate set runs on Linux. macOS and Windows run check + test: going
# cross-platform surfaced five real bugs on the first run of each new
# platform, so the compile-and-test truth is gated everywhere the desktop app
# ships. Style gates (fmt, clippy, doc) stay Linux-only; release.yml builds
# the shippable bundles on tag.

on:
  push:
  pull_request:

# A rapid push sequence should not queue redundant runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here publishes, and no secret is needed. cargo deny reaches
# the network only for advisory data.
permissions:
  contents: read

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # crates/hf-gui/src-tauri is a workspace member with no default-members to
      # exclude it, so every --workspace cargo command below builds it. On Linux
      # that needs WebKitGTK and friends, which the runner image lacks.
      - name: Install Linux build dependencies
        run: scripts/ci/install-linux-deps.sh

      # The Python script tests need no toolchain and finish in under a second.
      # Running them first fails fast, and a fourth job would not earn a runner.
      - name: Script tests
        run: scripts/tests/gates.sh script-tests

      # Same reasoning: no toolchain, instant, and a stale translation should
      # not be discovered after a full workspace build.
      - name: Translation pairing
        run: scripts/tests/gates.sh translation-pairing

      # No toolchain action on purpose: rust-toolchain.toml pins 1.94.0, and an
      # action that installs a channel would silently override the pin. rustup
      # is preinstalled on the runner and provisions the pinned toolchain here.
      - name: Provision the pinned toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: scripts/tests/gates.sh fmt

      - name: Clippy
        run: scripts/tests/gates.sh clippy

      - name: Check
        run: scripts/tests/gates.sh check

      - name: Check (no default features)
        run: scripts/tests/gates.sh check-no-default-features

      - name: Test
        run: scripts/tests/gates.sh test

      - name: Docs
        run: scripts/tests/gates.sh doc

  cross-platform:
    name: ${{ matrix.label }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # One platform's failure must not hide what the other platform found.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    defaults:
      run:
        # gates.sh is bash; the Windows runner defaults to pwsh.
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Provision the pinned toolchain
        run: rustup show active-toolchain

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: scripts/tests/gates.sh check

      - name: Test
        run: scripts/tests/gates.sh test

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/hf-gui/package-lock.json

      - name: Test and build
        run: scripts/tests/gates.sh frontend-test

      - name: Lint
        run: scripts/tests/gates.sh frontend-lint

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny

      - name: Deny
        run: scripts/tests/gates.sh deny

  # Informational, deliberately NOT in gates-passed' needs: TEST_STRATEGY.md
  # section 4 sets line-coverage targets that went unmeasured, and the number
  # must exist and be trusted before a threshold can gate on it. Promoting
  # this job to required (and adding it to gates-passed) is a separate
  # decision once a baseline is recorded.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Provision the pinned toolchain
        run: rustup show active-toolchain

      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.87.7
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Coverage
        run: scripts/tests/gates.sh coverage

  # Branch protection requires this one check instead of each job above. A
  # matrix job's check name is built from its label, so requiring those by name
  # silently drops a required check the moment a label changes; requiring one
  # aggregate does not.
  #
  # `if: always()` is load-bearing. Without it, a failed dependency SKIPS this
  # job, and GitHub counts a skipped required check as passing -- the gate would
  # report green for exactly the pipelines it exists to stop.
  gates-passed:
    name: All gates passed
    runs-on: ubuntu-latest
    needs: [rust, cross-platform, frontend, supply-chain]
    if: always()
    steps:
      - name: Fail if any gate did not succeed
        # GitHub can report other non-success results such as `abandoned` for a
        # failed matrix dependency, so require every named gate explicitly.
        run: |
          if [ "${{ needs.rust.result == 'success'
                 && needs['cross-platform'].result == 'success'
                 && needs.frontend.result == 'success'
                 && needs['supply-chain'].result == 'success' }}" != "true" ]; then
            echo "One or more gate jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
          echo "All gate jobs succeeded."
